# Workflow temporário: provisiona uma base de dados Prisma Postgres (UE),
# cria o esquema da Aloja e imprime a connection string ENCRIPTADA
# (RSA + AES — a chave privada nunca sai da sessão que pediu o setup).
# É removido depois da configuração inicial.

name: setup-db

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/db-setup-trigger"

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Escolher região na UE
        id: region
        run: |
          REGIONS=$(curl -fsS https://create-db-temp.prisma.io/regions)
          echo "Regiões disponíveis: $REGIONS"
          REGION=$(echo "$REGIONS" | node -e '
            let raw = "";
            process.stdin.on("data", (c) => (raw += c));
            process.stdin.on("end", () => {
              const data = JSON.parse(raw);
              const list = (Array.isArray(data) ? data : data.data ?? []).filter(
                (r) => r.status === "available"
              );
              const eu =
                list.find((r) => r.id === "eu-central-1") ??
                list.find((r) => String(r.id).startsWith("eu-")) ??
                list[0];
              if (!eu) throw new Error("Sem regiões disponíveis");
              process.stdout.write(eu.id);
            });
          ')
          echo "Região escolhida: $REGION"
          echo "region=$REGION" >> "$GITHUB_OUTPUT"

      - name: Criar base de dados
        id: createdb
        run: |
          RESP=$(curl -fsS -X POST https://create-db-temp.prisma.io/create \
            -H "Content-Type: application/json" \
            -d "{\"region\":\"${{ steps.region.outputs.region }}\",\"name\":\"aloja-beta\",\"utm_source\":\"aloja-setup\",\"userAgent\":\"aloja-setup\",\"source\":\"cli\",\"ttlMs\":2592000000}")
          echo "$RESP" > /tmp/createdb.json
          node -e '
            const fs = require("fs");
            const result = JSON.parse(fs.readFileSync("/tmp/createdb.json", "utf8"));
            if (result.error) {
              console.error("Erro:", JSON.stringify(result.error));
              process.exit(1);
            }
            const database = result.data?.database ?? result.databases?.[0];
            const projectId = result.data?.id ?? result.id ?? "";
            const conn = database?.connections?.find(
              (c) =>
                c.endpoints?.direct?.connectionString ||
                c.endpoints?.pooled?.connectionString
            );
            const cs =
              conn?.endpoints?.direct?.connectionString ??
              conn?.endpoints?.pooled?.connectionString;
            if (!cs) {
              console.error("Sem connection string na resposta:", JSON.stringify(result).slice(0, 1500));
              process.exit(1);
            }
            fs.writeFileSync(
              "/tmp/payload.json",
              JSON.stringify({
                connectionString: cs,
                projectId,
                claimUrl: `https://create-db.prisma.io/claim?projectID=${projectId}`,
              })
            );
            console.log("Base de dados criada. projectId:", projectId);
          '

      - name: Criar esquema e verificar
        run: |
          mkdir -p /tmp/ddl && cd /tmp/ddl && npm init -y >/dev/null && npm install pg@8 >/dev/null
          node -e '
            const fs = require("fs");
            const { Client } = require("/tmp/ddl/node_modules/pg");
            const { connectionString } = JSON.parse(fs.readFileSync("/tmp/payload.json", "utf8"));
            const ddl = fs.readFileSync(process.env.GITHUB_WORKSPACE + "/.github/aloja-schema.sql", "utf8");
            (async () => {
              const client = new Client({ connectionString });
              await client.connect();
              await client.query(ddl);
              const { rows } = await client.query("SELECT count(*)::int AS n FROM \"User\"");
              console.log("Esquema criado. Utilizadores:", rows[0].n);
              await client.end();
            })().catch((e) => {
              console.error("Erro ao criar esquema:", e.message);
              process.exit(1);
            });
          '

      - name: Encriptar e imprimir resultado
        run: |
          KEY=$(openssl rand -hex 32)
          CT=$(openssl enc -aes-256-cbc -pbkdf2 -pass pass:$KEY -base64 -A -in /tmp/payload.json)
          EK=$(echo -n "$KEY" | openssl pkeyutl -encrypt -pubin -inkey .github/setup-db-public.pem | base64 -w0)
          echo "ALOJA_EK_BEGIN"
          echo "$EK"
          echo "ALOJA_EK_END"
          echo "ALOJA_CT_BEGIN"
          echo "$CT"
          echo "ALOJA_CT_END"
